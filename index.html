<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erika's 54th Birthday &middot; October 2</title>
<meta name="description" content="Good food, good friends, good stories. Friday, October 2 at 7:30 P.M. Let's gather.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0605">

<!-- WhatsApp / link preview -->
<meta property="og:type" content="website">
<meta property="og:title" content="Erika's 54th Birthday">
<meta property="og:description" content="Good food &middot; Good friends &middot; Good stories. Friday, October 2 &middot; 7:30 P.M. Let's gather.">
<meta property="og:image" content="assets/preview.jpg">
<meta property="og:image:width" content="1200">

<meta property="og:image:alt" content="Erika's 54th Birthday invitation">
<meta name="twitter:card" content="summary_large_image">

<link rel="preload" href="assets/hero-760.jpg" as="image" media="(max-width: 47.99em)">
<link rel="preload" href="assets/hero-1400.jpg" as="image" media="(min-width: 48em)">
<link rel="preload" href="assets/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/cormorant-garamond-italic-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/kaushan-script-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/sacramento-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Gold line icons, matching the invitation's icon set -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <g id="i-calendar">
      <rect x="3.2" y="5.2" width="17.6" height="15.6" rx="2"/>
      <path d="M3.2 10.2h17.6M8 3.2v4M16 3.2v4"/>
      <path d="M8 13.8h.01M12 13.8h.01M16 13.8h.01M8 17.2h.01M12 17.2h.01M16 17.2h.01" stroke-width="2.1"/>
    </g>
    <g id="i-clock">
      <circle cx="12" cy="12" r="8.8"/>
      <path d="M12 6.6V12l3.6 2.6"/>
    </g>
    <!-- Two flutes, each pivoted about its own foot and set apart, so the
         rims meet at the centre instead of overlapping into a blur. -->
    <g id="i-flutes">
      <g transform="translate(-5 0) rotate(12 12 18.4)">
        <path d="M9.6 5.4h4.8l-.85 5.4a1.55 1.55 0 0 1-3.1 0Z"/>
        <path d="M12 12.4v5.5M10.4 18.4h3.2"/>
      </g>
      <g transform="translate(5 0) rotate(-12 12 18.4)">
        <path d="M9.6 5.4h4.8l-.85 5.4a1.55 1.55 0 0 1-3.1 0Z"/>
        <path d="M12 12.4v5.5M10.4 18.4h3.2"/>
      </g>
      <path d="M12 3.6V2.1M9.4 4.3 8.7 3.1M14.6 4.3l.7-1.2"/>
    </g>
    <g id="i-heart">
      <path d="M12 20.2C6.4 16.3 3.4 12.9 3.4 9.5c0-3 2.2-5 4.7-5 1.8 0 3.2 1 3.9 2.5.7-1.5 2.1-2.5 3.9-2.5 2.5 0 4.7 2 4.7 5 0 3.4-3 6.8-8.6 10.7Z"/>
    </g>
  </defs>
</svg>

<!-- The invitation photograph, with its lettering removed, plus a scrim -->
<div class="atmosphere" aria-hidden="true"><span class="vignette"></span></div>

<main class="page">

  <p class="eyebrow">
    <span>Good Food</span>
    <span>Good Friends</span>
    <span>Good Stories</span>
  </p>
  <hr class="rule rule--short">

  <h1 class="title">
    <span class="title__line">Erika's</span>
    <span class="title__script">54<span class="title__ord">th</span></span>
    <span class="title__line">Birthday</span>
  </h1>

  <p class="gather">
    <span class="gather__script">Let's Gather</span>
    <span class="gather__sub">Just Us Girls</span>
  </p>

  <div class="heart-rule" aria-hidden="true">
    <span class="heart-rule__line"></span>
    <svg class="heart-rule__heart" viewBox="0 0 24 24"><use href="#i-heart"/></svg>
    <span class="heart-rule__line"></span>
  </div>

  <section class="details" aria-label="Event details">
    <div class="detail">
      <svg class="detail__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-calendar"/></svg>
      <p class="detail__text">Friday<span>October 2</span></p>
    </div>
    <div class="detail">
      <svg class="detail__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-clock"/></svg>
      <p class="detail__text">7:30 P.M.</p>
    </div>
    <div class="detail">
      <svg class="detail__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flutes"/></svg>
      <p class="detail__text">Arepas &middot; Drinks<span>Friends &middot; Good Stories</span></p>
    </div>
  </section>

  <p class="closing">Same Great People<span>New Chapter</span></p>

  <hr class="rule">

  <!-- ============ RSVP ============ -->
  <section class="rsvp" id="rsvp" aria-labelledby="rsvp-heading">
    <h2 class="rsvp__heading" id="rsvp-heading">Will you join me?</h2>

    <form
      id="rsvp-form"
      name="rsvp"
      method="POST"
      action="/thank-you.html"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
    >
      <!-- Required by Netlify Forms so the submission is attributed to this form -->
      <input type="hidden" name="form-name" value="rsvp">
      <!-- Spam honeypot: hidden from people, tempting to bots -->
      <p class="hp">
        <label>Don't fill this out if you're human: <input name="bot-field" tabindex="-1" autocomplete="off"></label>
      </p>

      <div class="field">
        <label class="field__label" for="name">Your name</label>
        <input
          class="field__input"
          id="name"
          name="name"
          type="text"
          autocomplete="name"
          required
          maxlength="80"
          placeholder="First and last name">
      </div>

      <fieldset class="choices">
        <legend class="choices__legend">Your answer</legend>

        <label class="choice">
          <input type="radio" name="rsvp" value="Yes" required>
          <span class="choice__inner">
            <svg class="choice__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flutes"/></svg>
            <span class="choice__text">Yes, I'll be there</span>
            <span class="choice__mark" aria-hidden="true"></span>
          </span>
        </label>

        <label class="choice">
          <input type="radio" name="rsvp" value="No">
          <span class="choice__inner">
            <svg class="choice__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-heart"/></svg>
            <span class="choice__text">Sorry, I'll miss it</span>
            <span class="choice__mark" aria-hidden="true"></span>
          </span>
        </label>
      </fieldset>

      <button class="submit" type="submit" id="submit-btn">Confirm RSVP</button>

      <p class="form-error" id="form-error" role="alert" hidden></p>
    </form>
  </section>

  <!-- ============ Confirmation state (replaces the form after submit) ============ -->
  <section class="confirmation" id="confirmation" hidden tabindex="-1" aria-live="polite">
    <svg class="confirmation__icon" id="confirmation-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flutes"/></svg>
    <h2 class="confirmation__title" id="confirmation-title"></h2>
    <p class="confirmation__body" id="confirmation-body"></p>
    <p class="confirmation__meta" id="confirmation-meta"></p>
  </section>

</main>

<script src="rsvp.js" defer></script>
</body>
</html>
