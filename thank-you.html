<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you &middot; Erika's 54th Birthday</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0605">
<link rel="preload" href="assets/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/sacramento-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  .thanks { padding-top: 22vh; }
  .back {
    display: inline-block;
    margin-top: 2.5rem;
    font-size: 0.68rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--gold-line);
    padding-bottom: 3px;
  }
  .back:hover { color: var(--cream); }
  .back:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
</style>
</head>
<body>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <g id="i-heart">
      <path d="M12 20.2C6.4 16.3 3.4 12.9 3.4 9.5c0-3 2.2-5 4.7-5 1.8 0 3.2 1 3.9 2.5.7-1.5 2.1-2.5 3.9-2.5 2.5 0 4.7 2 4.7 5 0 3.4-3 6.8-8.6 10.7Z"/>
    </g>
  </defs>
</svg>

<div class="atmosphere" aria-hidden="true"><span class="vignette"></span></div>

<main class="page thanks">
  <!-- Fallback confirmation for visitors without JavaScript. The in-page
       confirmation on index.html is the normal experience. -->
  <section class="confirmation">
    <svg class="confirmation__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-heart"/></svg>
    <h1 class="confirmation__title">Thank you</h1>
    <p class="confirmation__body">Your RSVP is in. It means a lot.</p>
    <p class="confirmation__meta">Friday &middot; October 2 &middot; 7:30 P.M.</p>
    <!-- This fallback cannot tell yes from no, so it carries the city only,
         which reads correctly either way. -->
    <p class="confirmation__meta">Doral, Florida</p>
  </section>

  <hr class="rule">

  <a class="back" href="/">Back to the invitation</a>
</main>
</body>
</html>
