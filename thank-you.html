<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you · Erika's 54th Birthday</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0705">
<link rel="preload" href="assets/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/pinyon-script-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="atmosphere" aria-hidden="true">
  <span class="glow glow--a"></span>
  <span class="glow glow--b"></span>
  <span class="glow glow--c"></span>
  <span class="bokeh bokeh--1"></span>
  <span class="bokeh bokeh--3"></span>
  <span class="bokeh bokeh--5"></span>
  <span class="silhouettes"></span>
  <span class="vignette"></span>
</div>

<main class="page">
  <!-- Fallback confirmation for visitors without JavaScript. The in-page
       confirmation on index.html is the normal experience. -->
  <section class="confirmation">
    <p class="confirmation__icon" aria-hidden="true">&#129293;</p>
    <h1 class="confirmation__title">Thank you</h1>
    <p class="confirmation__body">Your RSVP is in. It means a lot.</p>
    <p class="confirmation__meta">Friday &middot; October 2 &middot; 7:30 P.M.</p>
  </section>

  <hr class="rule">

  <p class="footer"><a class="back" href="/">Back to the invitation</a></p>
</main>

<style>
  .back { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  .back:hover { color: var(--champagne); }
  .back:focus-visible { outline: 2px solid var(--amber-soft); outline-offset: 3px; }
</style>
</body>
</html>
